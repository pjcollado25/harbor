<!doctype html>

  <title>Harbor — irregular-income companion prototype</title>
  <style>

      --button-glass-hover: #e6f0fa;
      --button-ink: #ffffff;
      --button-hover: #224f7e;
      --focus: #337dc0;
      --input-glass: rgba(255,255,255,.9);
      --input-border: #9caec2;
      --input-placeholder: #6f8092;
      --input-error-bg: #fff9f8;
      --warning-callout-ink: #58400e;
      --income-dot: #b47d0a;
      --timeline-line: #a8b7c7;
      --timeline-expected: #a06f0a;

      --selected-marker: #f2d28c;

    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: var(--outer-canvas); }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }
    .prototype-wrap { min-height: 100svh; display: flex; justify-content: center; align-items: center; }
    .phone-frame { position: relative; width: min(100%, 430px); min-height: 100svh; margin: auto; }
    .app {
      width: 100%;
      min-height: 100svh;
      --phone-safe-bottom: env(safe-area-inset-bottom, 0px);
      background: radial-gradient(ellipse at 100% 0%, var(--ambient-a), transparent 35%), radial-gradient(ellipse at 0% 48%, var(--ambient-b), transparent 33%), var(--canvas);
      position: relative;
      box-shadow: 0 0 0 1px rgba(255,255,255,.06), 0 18px 60px rgba(0,0,0,.20);
      overflow: clip;
    }
    .app::after {
      content: "";
      position: absolute;
      z-index: 2;
      inset: auto 0 0;
      height: calc(106px + var(--phone-safe-bottom));
      pointer-events: none;
      background: linear-gradient(180deg, transparent 0%, var(--bottom-glass-tint) 46%, var(--bottom-glass-tint) 100%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-mask-image: linear-gradient(180deg, transparent 0%, #000 22%, #000 100%);
      mask-image: linear-gradient(180deg, transparent 0%, #000 22%, #000 100%);
    }
    .dynamic-island, .home-indicator { display: none; }
    .statusbar { height: 34px; padding: 10px 22px 0; display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 600; letter-spacing: .02em; }
    .status-icons { display: flex; align-items: center; gap: 6px; }
    .signal { width: 15px; height: 9px; display: inline-block; background: linear-gradient(to right, var(--ink) 0 22%, transparent 22% 28%, var(--ink) 28% 50%, transparent 50% 56%, var(--ink) 56% 78%, transparent 78% 84%, var(--ink) 84%); clip-path: polygon(0 35%, 22% 35%, 22% 100%, 0 100%, 28% 25%, 50% 25%, 50% 100%, 28% 100%, 56% 12%, 78% 12%, 78% 100%, 56% 100%, 84% 0, 100% 0, 100% 100%, 84% 100%); }
    .battery { width: 19px; height: 10px; border: 1.3px solid var(--ink); border-radius: 3px; position: relative; }
    .battery::before { content: ""; position: absolute; inset: 1.5px 4px 1.5px 1.5px; border-radius: 1px; background: var(--ink); }
    .battery::after { content: ""; position: absolute; right: -3px; top: 2.5px; height: 4px; width: 2px; border-radius: 0 2px 2px 0; background: var(--ink); }
    .topline { padding: 7px 22px 0; display: flex; align-items: center; justify-content: space-between; min-height: 44px; }
    .brand { color: var(--forest); font-size: 12px; font-weight: 700; letter-spacing: .08em; }

    main { height: calc(100svh - 78px); overflow-y: auto; padding-bottom: calc(108px + var(--phone-safe-bottom)); scrollbar-width: thin; }
    .page-head { padding: 10px 22px 0; }
    h1 { margin: 0; font-size: 25px; line-height: 1.2; font-weight: 650; letter-spacing: -.025em; }
    h1.serif { font-family: "DM Serif Display", Georgia, serif; font-size: 32px; font-weight: 400; letter-spacing: -.02em; }
    h2 { margin: 0; font-size: 18px; line-height: 1.35; font-weight: 650; letter-spacing: -.01em; }
    h3 { margin: 0; font-size: 16px; line-height: 1.4; font-weight: 650; }
    p { margin: 0; }
    .date-line { color: var(--muted); font-size: 15px; margin-top: 8px; }
    .section { padding: 22px 22px 0; }
    .section-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
    .eyebrow { color: var(--clay); font-size: 11px; line-height: 1.4; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
    .caption { color: var(--muted); font-size: 13px; line-height: 1.45; }
    .tiny { color: var(--muted); font-size: 12px; line-height: 1.45; }
    .surface { background: linear-gradient(145deg, var(--surface-glass-highlight), transparent 44%), var(--surface-glass); border: 1px solid var(--surface-border); border-radius: var(--radius-lg); -webkit-backdrop-filter: blur(18px) saturate(150%); backdrop-filter: blur(18px) saturate(150%); box-shadow: var(--surface-shadow); }
    .panel { padding: 16px; }
    .feature-card { padding: 17px; background: radial-gradient(ellipse at 100% 0%, var(--hero-glow), transparent 55%), linear-gradient(145deg, var(--surface-glass-highlight), transparent 44%), var(--surface-glass); }
    .due-card { margin-top: 8px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .row-top { align-items: flex-start; }
    .money { font-variant-numeric: tabular-nums; font-weight: 650; white-space: nowrap; }
    .money-large { font-size: 28px; line-height: 1.2; letter-spacing: -.025em; font-variant-numeric: tabular-nums; font-weight: 700; }
    .due-chip, .status-chip, .filter-chip, .seg-chip { display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; font-size: 12px; line-height: 1.2; font-weight: 650; white-space: nowrap; }
    .due-chip { color: var(--warning); background: var(--warning-bg); padding: 8px 12px; }
    .status-chip { padding: 6px 9px; gap: 5px; }
    .status-chip.expected { background: var(--warning-bg); color: var(--warning); }
    .status-chip.received, .status-chip.paid { background: var(--success-bg); color: var(--success); }
    .status-chip.overdue { background: var(--danger-bg); color: var(--danger); }
    .actions { display: flex; gap: 10px; margin-top: 8px; }
    .btn { border: 1px solid transparent; background: var(--forest); color: var(--button-ink); min-height: 48px; border-radius: 15px; padding: 12px 15px; font-size: 14px; font-weight: 650; transition: background .15s ease, transform .15s ease; }
    .btn:hover { background: var(--button-hover); }
    .btn:active { transform: translateY(1px); }
    .btn.secondary { color: var(--forest); background: var(--button-glass); border-color: var(--surface-border); -webkit-backdrop-filter: blur(14px) saturate(145%); backdrop-filter: blur(14px) saturate(145%); }
    .btn.secondary:hover { background: var(--button-glass-hover); }
    .btn.tertiary { min-height: 40px; padding: 8px 11px; color: var(--forest); background: transparent; border-color: var(--line); }
    .btn.danger-soft { background: var(--danger-bg); color: var(--danger); border-color: transparent; }
    .btn.full { width: 100%; }
    .actions .btn { flex: 1; }
    .text-button { color: var(--forest); border: 0; background: transparent; padding: 8px 0; font-size: 13px; font-weight: 650; text-decoration: underline; text-underline-offset: 3px; }
    .ledger-list { border-top: 1px solid var(--line); }
    .ledger-row { min-height: 66px; display: flex; justify-content: space-between; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); padding: 12px 0; }
    .ledger-row:last-child { border-bottom: 0; }
    .ledger-main { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    .ledger-title { font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
    .ledger-sub { font-size: 13px; line-height: 1.35; color: var(--muted); }
    .ledger-end { display: flex; align-items: flex-end; flex-direction: column; gap: 6px; }
    .planned-line { margin-top: 10px; padding-top: 12px; border-top: 1px solid var(--line); display: flex; align-items: baseline; justify-content: space-between; gap: 10px; color: var(--forest); font-size: 14px; font-weight: 650; }
    .callout { margin-top: 12px; padding: 13px 14px; background: var(--forest-soft); border-radius: var(--radius-md); color: var(--forest); font-size: 13px; line-height: 1.5; }
    .callout.warning { background: var(--warning-bg); color: var(--warning-callout-ink); }
    .callout.danger { background: var(--danger-bg); color: var(--danger); }
    .income-card { margin-top: 9px; padding: 14px; }
    .income-tag { display: inline-flex; align-items: center; gap: 7px; margin-top: 8px; font-size: 12px; color: var(--warning); font-weight: 650; }
    .income-dot { height: 8px; width: 8px; border-radius: 50%; background: var(--income-dot); box-shadow: 0 0 12px color-mix(in srgb, var(--income-dot) 42%, transparent); }
    .sample-note { padding: 14px 22px 2px; color: var(--muted); font-size: 12px; line-height: 1.45; }
    .nav { position: absolute; bottom: calc(12px + var(--phone-safe-bottom)); left: 14px; right: 14px; min-height: 74px; padding: 7px 8px; border: 1px solid var(--nav-outline); border-radius: var(--radius-nav); background: linear-gradient(145deg, var(--surface-glass-highlight), transparent 55%), var(--nav-glass); -webkit-backdrop-filter: blur(24px) saturate(175%); backdrop-filter: blur(24px) saturate(175%); box-shadow: var(--nav-shadow); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; z-index: 3; }
    .nav button { border: 0; border-radius: 19px; background: transparent; color: var(--muted); min-height: 56px; padding: 5px 3px; display: flex; align-items: center; flex-direction: column; justify-content: center; gap: 3px; font-size: 12px; line-height: 1.1; font-weight: 600; transition: background .16s ease, color .16s ease, transform .16s ease; }
    .nav button:active { transform: scale(.97); }
    .nav button[aria-current="page"] { color: var(--forest); background: var(--active-tab-bg); box-shadow: inset 0 0 0 1px var(--active-tab-border), 0 0 18px var(--active-tab-bg); font-weight: 750; }
    .nav-icon { width: 22px; height: 22px; display: grid; place-items: center; }
    .nav-icon svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .back { display: inline-flex; gap: 7px; align-items: center; min-height: 40px; border: 0; background: transparent; color: var(--forest); padding: 2px 0; font-size: 13px; font-weight: 650; }
    .back::before { content: "←"; font-size: 19px; line-height: 1; }
    .form { padding: 20px 22px 0; }
    .field { margin-bottom: 17px; }
    .field label { display: block; margin-bottom: 7px; font-size: 13px; font-weight: 650; }
    .field-hint { margin-top: 6px; color: var(--muted); font-size: 12px; line-height: 1.4; }
    input, select, textarea { width: 100%; min-height: 50px; padding: 12px 13px; border-radius: var(--radius-sm); border: 1px solid var(--input-border); background: var(--input-glass); color: var(--ink); font-size: 15px; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
    input::placeholder, textarea::placeholder { color: var(--input-placeholder); }
    input[aria-invalid="true"], select[aria-invalid="true"] { border-color: var(--danger); background: var(--input-error-bg); }
    .field-error { margin-top: 5px; color: var(--danger); font-size: 12px; line-height: 1.4; }
    .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .segmented { display: flex; gap: 5px; padding: 4px; border: 1px solid var(--surface-border); border-radius: 999px; background: var(--glass-control); -webkit-backdrop-filter: blur(16px) saturate(150%); backdrop-filter: blur(16px) saturate(150%); }
    .segmented button { min-height: 38px; padding: 8px 11px; flex: 1; border: 0; border-radius: 999px; background: transparent; color: var(--muted); font-size: 12px; font-weight: 650; }
    .segmented button[aria-pressed="true"] { background: var(--surface-glass); color: var(--forest); box-shadow: 0 2px 10px rgba(0,0,0,.18), inset 0 1px 0 var(--surface-glass-highlight); }
    .sticky-action { position: sticky; bottom: calc(100px + var(--phone-safe-bottom)); margin: 20px -22px 0; padding: 12px 22px 16px; background: linear-gradient(180deg, transparent, var(--canvas) 18%); }
    .search-wrap { padding: 18px 22px 0; }
    .search-wrap input { min-height: 46px; border-radius: 999px; padding-left: 16px; }
    .filters { padding: 12px 22px 0; display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none; }
    .filters::-webkit-scrollbar { display: none; }
    .filter-chip { padding: 9px 12px; border: 1px solid var(--surface-border); border-radius: 999px; color: var(--muted); background: var(--button-glass); -webkit-backdrop-filter: blur(14px) saturate(145%); backdrop-filter: blur(14px) saturate(145%); cursor: pointer; }
    .filter-chip[aria-pressed="true"] { color: var(--forest); background: var(--active-tab-bg); border-color: var(--active-tab-border); }
    .bill-list { padding: 17px 22px 0; }

    .bill-item:first-child { border-top: 1px solid var(--line); }

    .bill-open .ledger-title { display: block; margin-bottom: 5px; }
    .bill-actions { display: flex; align-items: center; gap: 8px; }
    .detail-amount { padding: 18px; margin-top: 14px; }
    .detail-action-list { padding: 18px 22px 0; display: grid; gap: 10px; }
    .detail-action-list .btn { width: 100%; }
    .date-pill { display: inline-flex; padding: 6px 10px; border-radius: 999px; background: var(--surface-muted); color: var(--muted); font-size: 12px; font-weight: 600; }
    .metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .metric { border: 1px solid var(--surface-border); background: linear-gradient(145deg, var(--surface-glass-highlight), transparent 50%), var(--surface-glass); -webkit-backdrop-filter: blur(16px) saturate(145%); backdrop-filter: blur(16px) saturate(145%); box-shadow: var(--surface-shadow); border-radius: var(--radius-md); padding: 13px; min-height: 88px; }
    .metric strong { display: block; margin-top: 6px; font-size: 18px; font-variant-numeric: tabular-nums; }
    .timeline { border-left: 1px solid var(--timeline-line); margin: 15px 0 0 7px; padding-left: 16px; }
    .timeline-item { position: relative; padding: 0 0 20px; }
    .timeline-item::before { content: ""; position: absolute; width: 10px; height: 10px; left: -22px; top: 4px; border-radius: 50%; border: 2px solid var(--forest); background: var(--canvas); }

    .timeline-date { font-size: 12px; color: var(--muted); margin-bottom: 3px; }
    .timeline-title { font-size: 14px; font-weight: 650; }
    .timeline-detail { margin-top: 3px; color: var(--muted); font-size: 12px; }

    .calendar-event-detail { color: var(--muted); font-size: 12px; line-height: 1.35; }

    .toast button { border: 0; background: transparent; color: var(--toast-action); text-decoration: underline; text-underline-offset: 2px; padding: 6px 2px; font-weight: 700; }
    .toast[hidden] { display: none; }
    .empty { padding: 22px 0; text-align: center; color: var(--muted); font-size: 14px; line-height: 1.5; }
    .divider { border: 0; border-top: 1px solid var(--line); margin: 17px 0; }
    .setting-row { display: flex; gap: 12px; align-items: center; justify-content: space-between; min-height: 56px; border-bottom: 1px solid var(--line); }
    .setting-row:last-child { border-bottom: 0; }
    .switch { appearance: none; width: 44px; min-height: 26px; height: 26px; padding: 3px; border: 0; border-radius: 99px; background: var(--line); cursor: pointer; transition: background .15s; }
    .switch::before { content: ""; display: block; width: 20px; height: 20px; border-radius: 50%; background: var(--switch-knob); transition: transform .15s; }
    .switch:checked { background: var(--forest); }
    .switch:checked::before { transform: translateX(18px); }
    .success-mark { width: 58px; height: 58px; display: grid; place-items: center; border-radius: 50%; background: var(--success-bg); color: var(--success); font-size: 28px; margin: 28px auto 16px; }
    .center { text-align: center; }
    .screen-note { margin-top: 10px; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .dynamic-island { position: absolute; z-index: 4; top: 8px; left: 50%; width: 126px; height: 35px; transform: translateX(-50%); border-radius: 999px; background: #030504; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
    .dynamic-island::after { content: ""; position: absolute; top: 11px; right: 12px; width: 10px; height: 10px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #263b42, #101616 70%); box-shadow: 0 0 0 1px rgba(91,127,137,.18); }
    .home-indicator { position: absolute; z-index: 4; bottom: 7px; left: 50%; width: 118px; height: 4px; transform: translateX(-50%); border-radius: 999px; background: var(--home-indicator); pointer-events: none; }
    @media (min-width: 700px) {
      body { background: var(--outer-canvas); }
      .prototype-wrap { padding: 16px; align-items: flex-start; }
      .phone-frame { width: 414px; height: 872px; min-height: 0; flex: none; position: relative; isolation: isolate; padding: 13px 11px; border: 1px solid var(--device-edge); border-radius: 54px; background: linear-gradient(140deg, var(--device-shell-light), var(--device-shell-dark) 42%, var(--device-shell-light)); box-shadow: 0 32px 90px rgba(0,0,0,.58), inset 0 1px 1px rgba(255,255,255,.28), inset 0 0 0 1px rgba(0,0,0,.48); }
      .phone-frame::before, .phone-frame::after { content: ""; position: absolute; z-index: -1; width: 4px; border-radius: 3px; background: var(--device-key); box-shadow: inset 0 0 1px rgba(255,255,255,.3); }
      .phone-frame::before { top: 154px; left: -4px; height: 28px; box-shadow: inset 0 0 1px rgba(255,255,255,.3), 0 36px 0 var(--device-key); }
      .phone-frame::after { top: 190px; right: -4px; height: 58px; }
      .phone-frame .app { width: 100%; height: 100%; min-height: 0; border-radius: 40px; --phone-safe-bottom: 26px; box-shadow: none; }
      .phone-frame .dynamic-island, .phone-frame .home-indicator { display: block; }
      main { height: calc(100% - 78px); }
    }
    @media (max-width: 359px) {
      .section, .form, .detail-action-list, .bill-list, .search-wrap, .filters { padding-left: 16px; padding-right: 16px; }
      .page-head, .topline { padding-left: 16px; padding-right: 16px; }
      .sample-note { padding-left: 16px; padding-right: 16px; }
      .actions { gap: 7px; }
      .btn { padding-left: 11px; padding-right: 11px; }
      .sticky-action { margin-left: -16px; margin-right: -16px; padding-left: 16px; padding-right: 16px; }
    }
    @supports not (backdrop-filter: blur(1px)) {
      .nav, .surface, .metric, .filter-chip, .btn.secondary, .segmented, input, select, textarea { background: var(--surface-fallback); }
      .app::after { -webkit-backdrop-filter: none; backdrop-filter: none; background: linear-gradient(180deg, transparent, var(--canvas) 74%); }
    }
    @media (prefers-reduced-transparency: reduce) {
      .nav, .surface, .feature-card, .metric, .filter-chip, .btn.secondary, .segmented, input, select, textarea { background: var(--surface-fallback); -webkit-backdrop-filter: none; backdrop-filter: none; }
      .app::after { -webkit-backdrop-filter: none; backdrop-filter: none; background: linear-gradient(180deg, transparent, var(--canvas) 74%); }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="prototype-wrap">
    <div class="phone-frame" role="region" aria-label="iPhone-style prototype preview">
    <div class="app" id="app" aria-label="Harbor interactive mobile prototype">
      <div class="statusbar" aria-hidden="true"><span>9:41</span><span class="status-icons"><i class="signal"></i><span>Wi-Fi</span><i class="battery"></i></span></div>
      <div class="dynamic-island" aria-hidden="true"></div>
      <div class="topline"><span class="brand">HARBOR</span></div>
      <main id="main" tabindex="-1"></main>
      <nav class="nav" aria-label="Main navigation">
        <button data-nav="today" aria-label="Today"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m3.5 10 8.5-7 8.5 7"/><path d="M5.5 9v11h13V9M9.5 20v-6h5v6"/></svg></span></button>
        <button data-nav="plan" aria-label="Plan"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="17" height="15" rx="2.5"/><path d="M7.5 3.5v4M16.5 3.5v4M3.5 10h17M8 14h.01M12 14h.01M16 14h.01M8 17h.01M12 17h.01"/></svg></span></button>
        <button data-nav="bills" aria-label="Bills"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 3.5h12v17l-3-1.8-3 1.8-3-1.8-3 1.8z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg></span></button>
        <button data-nav="activity" aria-label="Activity"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 19.5v-6M10 19.5v-11M16 19.5v-4M22 19.5v-9"/><path d="M3 20.5h20"/></svg></span></button>
        <button data-nav="settings" aria-label="Settings"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.3 7.3 0 0 0-1.63-.94l-.36-2.54a.49.49 0 0 0-.49-.42h-3.84a.49.49 0 0 0-.49.42l-.36 2.54c-.59.23-1.13.54-1.63.94l-2.39-.96a.49.49 0 0 0-.61.22L2.64 8.84a.5.5 0 0 0 .12.64l2.03 1.58a7.5 7.5 0 0 0 0 1.88l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.12.21.37.29.61.22l2.39-.96c.5.4 1.04.71 1.63.94l.36 2.54c.04.24.24.42.49.42h3.84c.25 0 .45-.18.49-.42l.36-2.54c.59-.23 1.13-.54 1.63-.94l2.39.96c.24.07.49-.01.61-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58Z"/><circle cx="12" cy="12" r="3"/></svg></span></button>
      </nav>
      <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
      <div class="home-indicator" aria-hidden="true"></div>
    </div>
    </div>
  </div>
  <script>
    (() => {
      const sampleBills = [
        { id: "internet", name: "Internet", amount: 1899, due: "2026-10-23", category: "Utilities", frequency: "Monthly", estimate: false, reminder: "3 days before", status: "upcoming" },
        { id: "rent", name: "Rent", amount: 6000, due: "2026-10-25", category: "Housing", frequency: "Monthly", estimate: false, reminder: "1 day before", status: "upcoming" },
        { id: "power", name: "Power", amount: 2900, due: "2026-10-29", category: "Utilities", frequency: "Monthly", estimate: true, reminder: "Day of", status: "upcoming" }
      ];
      const state = {
        screen: "today", from: "today", bills: sampleBills, selectedBill: "internet", filter: "All", query: "",
        funds: 10500, fundsDate: "2026-10-20", income: { name: "Logo project", amount: 14000, date: "2026-10-28", originalDate: "2026-10-28", status: "Expected" },
        delayed: false, calendarView: "Agenda", calendarMonth: "2026-10", calendarDate: "2026-10-23", payments: [], addedBillId: null, undoPayment: null,
        draft: {}, errors: {}, toastTimer: null, showIncomeInActivity: true
      };
      const main = document.getElementById("main");
      const toast = document.getElementById("toast");
      const themeColor = document.querySelector('meta[name="theme-color"]');
      const setTheme = theme => {
        document.documentElement.dataset.theme = theme;
        themeColor.content = theme === "dark" ? "#07090d" : "#f2f5f9";
      };
      setTheme("dark");
      const fmt = n => new Intl.NumberFormat("en-PH", { style: "currency", currency: "PHP", maximumFractionDigits: 0 }).format(Number(n) || 0).replace("PHP", "₱").replace(/\u00a0/g, "");
      const formatDate = (iso, opts = { day: "numeric", month: "short" }) => new Intl.DateTimeFormat("en-PH", opts).format(new Date(iso + "T12:00:00"));
      const escapeHtml = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
      const billById = id => state.bills.find(b => b.id === id);
      const selectedBill = () => billById(state.selectedBill) || state.bills[0];
      const paidTotal = id => state.payments.filter(p => p.billId === id).reduce((a, p) => a + p.amount, 0);
      const remaining = bill => Math.max(0, bill.amount - paidTotal(bill.id));
      const billStatus = bill => remaining(bill) === 0 ? "Paid" : paidTotal(bill.id) > 0 ? "Partially paid" : bill.status === "overdue" ? "Overdue" : "Upcoming";
      const statusClass = status => status.toLowerCase().includes("paid") || status === "Received" ? "paid" : status === "Overdue" ? "overdue" : "expected";
      const datesSorted = list => [...list].sort((a, b) => a.due.localeCompare(b.due));
      const plannedTotal = () => state.bills.reduce((sum, b) => sum + remaining(b), 0);
      const netPlan = () => state.funds + (state.income.status === "Received" ? state.income.amount : (state.delayed ? 0 : state.income.amount)) - plannedTotal();
      const monthCalendarView = () => {
        const [year, monthNumber] = state.calendarMonth.split("-").map(Number), month = monthNumber - 1;
        const firstDay = new Date(Date.UTC(year, month, 1)).getUTCDay();
        const mondayOffset = (firstDay + 6) % 7, dayCount = new Date(Date.UTC(year, month + 1, 0)).getUTCDate();
        const monthTitle = new Intl.DateTimeFormat("en-PH", { month: "long", year: "numeric", timeZone: "UTC" }).format(new Date(Date.UTC(year, month, 1)));
        const dayButtons = [];
        for (let slot = 0; slot < Math.ceil((mondayOffset + dayCount) / 7) * 7; slot++) {
          const day = slot - mondayOffset + 1;
          if (day < 1 || day > dayCount) { dayButtons.push('<span class="month-day empty" aria-hidden="true"></span>'); continue; }
          const date = `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
          const count = state.bills.filter(b => b.due === date).length + (state.income.date === date ? 1 : 0);
          const label = `${formatDate(date, { weekday: "long", day: "numeric", month: "long" })}, ${count} listed event${count === 1 ? "" : "s"}`;
          dayButtons.push(`<button class="month-day" data-action="select-calendar-date" data-date="${date}" aria-label="${label}" aria-pressed="${state.calendarDate === date}"><span>${day}</span>${count ? '<i class="calendar-marker" aria-hidden="true"></i>' : ""}</button>`);
        }
        const bills = state.bills.filter(b => b.due === state.calendarDate);
        const income = state.income.date === state.calendarDate ? state.income : null;
        const events = [
          ...bills.map(b => `<button class="calendar-event" data-action="detail" data-id="${escapeHtml(b.id)}"><span class="calendar-event-main"><span class="calendar-event-title">${escapeHtml(b.name)}</span><span class="calendar-event-detail">Bill · ${billStatus(b)}${b.estimate ? " · estimate" : ""}</span></span><strong class="money">${fmt(remaining(b))}</strong></button>`),
          ...(income ? [`<div class="calendar-event"><span class="calendar-event-main"><span class="calendar-event-title">${escapeHtml(income.name)}</span><span class="calendar-event-detail">${income.status === "Received" ? "Received · entered by you" : "Expected · entered by you"}</span></span><strong class="money">${fmt(income.amount)}</strong></div>`] : [])
        ].join("");
        return `<article class="surface month-calendar" aria-label="Monthly calendar"><div class="calendar-month-header"><button type="button" data-action="calendar-month-shift" data-delta="-1" aria-label="Previous month">‹</button><strong>${monthTitle}</strong><button type="button" data-action="calendar-month-shift" data-delta="1" aria-label="Next month">›</button></div><div class="calendar-weekdays" aria-hidden="true">${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d => `<span>${d}</span>`).join("")}</div><div class="calendar-grid">${dayButtons.join("")}</div><div class="calendar-events"><div class="eyebrow">${formatDate(state.calendarDate, { weekday: "long", day: "numeric", month: "short" })}</div>${events || '<p class="empty" style="padding:12px 0 0">No listed bills or income on this date.</p>'}</div></article>`;
      };
      const isNavScreen = s => ["today", "plan", "bills", "activity", "settings"].includes(s);
      const setScreen = (screen, from = state.screen) => { state.from = from; state.screen = screen; state.errors = {}; render(); main.scrollTop = 0; };
      const showToast = (message, undo = false) => {
        toast.innerHTML = `<span>${escapeHtml(message)}</span>${undo ? '<button type="button" data-action="undo-payment">Undo</button>' : ""}`;
        toast.hidden = false;
        clearTimeout(state.toastTimer);
        if (!undo) state.toastTimer = setTimeout(() => toast.hidden = true, 3600);
      };
      const header = (title, subtitle = "", serif = false, back = false) => `<div class="page-head">${back ? '<button class="back" data-action="back">Back</button>' : ""}<h1 class="${serif ? "serif" : ""}">${title}</h1>${subtitle ? `<p class="date-line">${subtitle}</p>` : ""}</div>`;
      const sectionHead = (label, action = "", actionName = "") => `<div class="section-heading"><span class="eyebrow">${label}</span>${action ? `<button class="text-button" data-action="${action}">${actionName}</button>` : ""}</div>`;
      const navButtonState = () => {
        document.querySelectorAll("[data-nav]").forEach(b => {
          const active = b.dataset.nav === state.screen || (state.screen === "insights" || state.screen === "progress") && b.dataset.nav === "activity";
          if (active) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
        });
        document.querySelector(".nav").hidden = !isNavScreen(state.screen) && !["insights", "progress", "settings"].includes(state.screen);
      };
      const billRow = (bill, clickable = true) => {
        const status = billStatus(bill);
        return `<div class="ledger-row"><button class="bill-open ledger-main" data-action="detail" data-id="${escapeHtml(bill.id)}" ${clickable ? "" : "disabled"}><span class="ledger-title">${escapeHtml(bill.name)}</span><span class="ledger-sub">${formatDate(bill.due, { day: "numeric", month: "short" })} · ${bill.estimate ? "estimate" : "fixed"} · ${escapeHtml(bill.category)}</span></button><div class="ledger-end"><span class="money">${fmt(remaining(bill))}</span><span class="status-chip ${statusClass(status)}">${status}</span></div></div>`;
      };
      const todayView = () => {
        const openBills = datesSorted(state.bills.filter(b => remaining(b) > 0));
        const next = openBills[0];
        const planned = netPlan();
        return `${header("Today", "Tuesday, 20 October", true)}
          ${next ? `<section class="section">${sectionHead("Next due")}<article class="surface feature-card due-card"><div class="row row-top"><div><h2>${escapeHtml(next.name)}</h2><p class="caption" style="margin-top:4px">${formatDate(next.due, { weekday: "short", day: "numeric", month: "short" })} · ${next.estimate ? "Estimated amount" : "Fixed amount"}</p></div><strong class="money">${fmt(remaining(next))}</strong></div><div style="margin-top:11px"><span class="due-chip">Due in ${Math.max(0, Math.ceil((new Date(next.due + "T12:00:00") - new Date("2026-10-20T12:00:00")) / 86400000))} days</span></div><div class="actions"><button class="btn secondary" data-action="detail" data-id="${next.id}">View bill</button><button class="btn" data-action="payment" data-id="${next.id}">Record payment</button></div></article></section>` : `<section class="section"><div class="callout">No unpaid bills are listed. Add an obligation whenever you’re ready.</div></section>`}
          <section class="section">${sectionHead(`In the next 14 days · ${openBills.length} bills`, "bills", "See all")}<div class="ledger-list">${openBills.slice(0, 3).filter(b => !next || b.id !== next.id).map(b => billRow(b)).join("") || (next ? billRow(next) : '<p class="empty">Nothing due in the next 14 days.</p>')}</div><div class="planned-line"><span>${fmt(openBills.reduce((a,b) => a + remaining(b), 0))} planned obligations</span><button class="text-button" data-action="plan">Review plan</button></div></section>
          <section class="section">${sectionHead("Expected income", "plan", "Open plan")}<article class="surface income-card"><div class="row"><div><strong>${escapeHtml(state.income.name)}</strong><p class="caption" style="margin-top:4px">${formatDate(state.income.date, { day: "numeric", month: "short" })}</p></div><strong class="money">${fmt(state.income.amount)}</strong></div><span class="income-tag"><i class="income-dot"></i>${state.income.status === "Received" ? "Received · entered by you" : "Expected · entered by you"}</span></article></section>
          <section class="section"><article class="surface panel"><div class="eyebrow">Planned after known commitments</div><div class="row" style="margin-top:8px"><strong class="money-large">${fmt(planned)}</strong><button class="btn tertiary" data-action="plan">Review</button></div><p class="tiny" style="margin-top:8px">${fmt(state.funds)} starting funds entered by you · ${formatDate(state.fundsDate)}</p><p class="tiny" style="margin-top:6px">A plan based on the items listed here, not a bank balance.</p></article></section>
          <section class="section"><button class="btn secondary full" data-action="add-bill">＋ Add a bill</button></section>
          <p class="sample-note">Sample amounts are fictional. Harbor does not connect to a bank or verify funds.</p>`;
      };
      const billsView = () => {
        const allFilters = ["All", "Upcoming", "Due soon", "Overdue", "Paid"];
        const filtered = datesSorted(state.bills).filter(b => {
          const q = state.query.toLowerCase();
          const matchesText = !q || `${b.name} ${b.category}`.toLowerCase().includes(q);
          const status = billStatus(b);
          const matchesFilter = state.filter === "All" || state.filter === status || (state.filter === "Upcoming" && status !== "Paid") || (state.filter === "Due soon" && status !== "Paid" && new Date(b.due) <= new Date("2026-10-27"));
          return matchesText && matchesFilter;
        });
        return `${header("Bills", "Known obligations and their next dates")}
          <div class="search-wrap"><label class="tiny" for="bill-search">Search bills</label><input id="bill-search" type="search" placeholder="Search bills" value="${escapeHtml(state.query)}" aria-label="Search bills"></div>
          <div class="filters" role="group" aria-label="Filter bills">${allFilters.map(f => `<button class="filter-chip" data-action="filter" data-filter="${f}" aria-pressed="${state.filter === f}">${f}</button>`).join("")}</div>
          <section class="section" style="padding-top:18px"><div class="row"><span class="caption">${state.bills.length} listed · totals are entered by you</span><strong class="money">${fmt(state.bills.reduce((a,b) => a + remaining(b), 0))}</strong></div></section>
          <section class="bill-list">${filtered.length ? filtered.map(b => `<div class="bill-item"><button class="bill-open" data-action="detail" data-id="${escapeHtml(b.id)}"><span class="ledger-title">${escapeHtml(b.name)}</span><span class="ledger-sub">${formatDate(b.due, { weekday: "short", day: "numeric", month: "short" })} · ${escapeHtml(b.frequency)} · ${b.estimate ? "Estimate" : "Fixed"}</span></button><div class="bill-actions"><span class="money">${fmt(remaining(b))}</span><span class="status-chip ${statusClass(billStatus(b))}">${billStatus(b)}</span></div></div>`).join("") : `<div class="empty">No bills match this view.<br><button class="text-button" data-action="clear-filters">Clear filters</button></div>`}</section>
          <section class="section"><button class="btn full" data-action="add-bill">＋ Add a bill</button></section>
          <p class="sample-note">Expected income is shown separately in Plan. “Paid” here means recorded by you.</p>`;
      };
      const formVal = (name, fallback = "") => state.draft[name] ?? fallback;
      const fieldError = name => state.errors[name] ? `<div class="field-error" id="error-${name}">${escapeHtml(state.errors[name])}</div>` : "";
      const fieldAttr = name => state.errors[name] ? `aria-invalid="true" aria-describedby="error-${name}"` : "";
      const addBillView = () => `${header("Add a bill", "Enter what you know. You can edit it later.", false, true)}
        <form class="form" id="bill-form" novalidate>
          <div class="field"><label for="bill-name">Bill or payee name</label><input id="bill-name" name="name" autocomplete="off" placeholder="e.g. Water" value="${escapeHtml(formVal("name"))}" ${fieldAttr("name")} required>${fieldError("name")}</div>
          <div class="field"><label>Amount type</label><div class="segmented"><button type="button" data-action="amount-type" data-value="fixed" aria-pressed="${formVal("estimate") !== "true"}">Fixed</button><button type="button" data-action="amount-type" data-value="estimate" aria-pressed="${formVal("estimate") === "true"}">Estimate</button></div><input type="hidden" name="estimate" value="${formVal("estimate", "false")}"></div>
          <div class="field"><label for="bill-amount">Amount <span class="tiny">(PHP)</span></label><input id="bill-amount" name="amount" inputmode="decimal" placeholder="0" value="${escapeHtml(formVal("amount"))}" ${fieldAttr("amount")} required>${fieldError("amount")}<p class="field-hint">${formVal("estimate") === "true" ? "You can update an estimate when the actual amount is known." : "Enter the amount you expect to pay."}</p></div>
          <div class="field-grid"><div class="field"><label for="bill-due">Next due date</label><input id="bill-due" type="date" name="due" value="${escapeHtml(formVal("due", "2026-11-05"))}" ${fieldAttr("due")} required>${fieldError("due")}</div><div class="field"><label for="bill-frequency">Frequency</label><select id="bill-frequency" name="frequency"><option ${formVal("frequency", "Monthly") === "Once" ? "selected" : ""}>Once</option><option ${formVal("frequency", "Monthly") === "Weekly" ? "selected" : ""}>Weekly</option><option ${formVal("frequency", "Monthly") === "Biweekly" ? "selected" : ""}>Biweekly</option><option ${formVal("frequency", "Monthly") === "Monthly" ? "selected" : ""}>Monthly</option><option ${formVal("frequency", "Monthly") === "Quarterly" ? "selected" : ""}>Quarterly</option><option ${formVal("frequency", "Monthly") === "Yearly" ? "selected" : ""}>Yearly</option></select></div></div>
          <div class="field"><label for="bill-category">Category</label><select id="bill-category" name="category"><option>Utilities</option><option>Housing</option><option>Phone</option><option>Insurance</option><option>Subscriptions</option><option>Other</option></select></div>
          <div class="field"><label for="bill-reminder">Reminder</label><select id="bill-reminder" name="reminder"><option>3 days before</option><option>1 day before</option><option>Day of</option><option>No reminder</option></select><p class="field-hint">A reminder is a local preference in this prototype. No notification is sent.</p></div>
          <div class="sticky-action"><button class="btn full" type="submit">Save bill</button></div>
        </form>`;
      const detailView = () => {
        const b = selectedBill();
        if (!b) return `${header("Bill details", "", false, true)}<section class="section"><p class="empty">This bill is no longer listed.</p></section>`;
        const status = billStatus(b);
        return `${header("Bill details", escapeHtml(b.category), false, true)}
          <section class="section"><div class="row row-top"><h2>${escapeHtml(b.name)}</h2><span class="status-chip ${statusClass(status)}">${status}</span></div>
            <article class="surface detail-amount"><div class="eyebrow">${b.estimate ? "Estimated amount" : "Amount"}</div><div class="money-large" style="margin-top:6px">${fmt(remaining(b))}</div><p class="caption" style="margin-top:6px">${b.estimate ? "This is an estimate you entered." : "Amount entered by you."}</p><hr class="divider"><div class="row"><span class="caption">Due date</span><strong>${formatDate(b.due, { weekday: "long", day: "numeric", month: "long" })}</strong></div><div class="row" style="margin-top:12px"><span class="caption">Repeats</span><strong>${escapeHtml(b.frequency)}</strong></div><div class="row" style="margin-top:12px"><span class="caption">Reminder</span><strong>${escapeHtml(b.reminder)}</strong></div>${paidTotal(b.id) ? `<div class="callout">${fmt(paidTotal(b.id))} recorded as paid by you. Remaining ${fmt(remaining(b))}.</div>` : ""}</article>
          </section>
          <section class="section">${sectionHead("Recent activity")}<div class="ledger-list">${state.payments.filter(p => p.billId === b.id).slice().reverse().map(p => `<div class="ledger-row"><div class="ledger-main"><strong class="ledger-title">Payment recorded</strong><span class="ledger-sub">${formatDate(p.date, { day: "numeric", month: "short", year: "numeric" })} · entered by you</span></div><strong class="money">${fmt(p.amount)}</strong></div>`).join("") || `<p class="caption">No payment recorded yet.</p>`}</div></section>
          <section class="detail-action-list"><button class="btn" data-action="payment" data-id="${b.id}" ${remaining(b) <= 0 ? "disabled" : ""}>Record payment</button><button class="btn secondary" data-action="reminder" data-id="${b.id}">Set reminder</button><button class="btn secondary" data-action="bills">Back to bills</button></section>
          <p class="sample-note">Payments and reminders are manually recorded in this prototype.</p>`;
      };
      const reminderView = () => {
        const b = selectedBill();
        return `${header("Reminder settings", escapeHtml(b.name), false, true)}<section class="section"><article class="surface panel"><div class="eyebrow">Choose when to be reminded</div><p class="caption" style="margin-top:7px">The notification can hide the bill name and amount on your lock screen.</p></article></section>
          <form class="form" id="reminder-form"><div class="field"><label for="reminder-offset">Reminder timing</label><select id="reminder-offset" name="reminder"><option ${b.reminder === "Day of" ? "selected" : ""}>Day of</option><option ${b.reminder === "1 day before" ? "selected" : ""}>1 day before</option><option ${b.reminder === "3 days before" ? "selected" : ""}>3 days before</option><option ${b.reminder === "7 days before" ? "selected" : ""}>7 days before</option><option ${b.reminder === "No reminder" ? "selected" : ""}>No reminder</option></select></div><div class="surface panel"><div class="setting-row"><div><strong class="ledger-title">Hide details in preview</strong><p class="tiny">Show “A bill is coming up”</p></div><input class="switch" type="checkbox" checked aria-label="Hide details in reminder preview"></div></div><div class="sticky-action"><button class="btn full" type="submit">Save reminder</button></div></form>`;
      };
      const paymentView = () => {
        const b = selectedBill();
        return `${header("Record payment", escapeHtml(b.name), false, true)}<form class="form" id="payment-form" novalidate><article class="surface panel" style="margin-bottom:18px"><div class="row"><span class="caption">Remaining amount</span><strong class="money">${fmt(remaining(b))}</strong></div><p class="field-hint">Enter the amount you paid. A partial payment is okay.</p></article><div class="field"><label for="payment-amount">Amount paid</label><input id="payment-amount" name="amount" inputmode="decimal" value="${remaining(b)}" ${fieldAttr("amount")} required>${fieldError("amount")}</div><div class="field"><label for="payment-date">Payment date</label><input id="payment-date" name="date" type="date" value="2026-10-20" required></div><div class="field"><label for="payment-note">Note <span class="tiny">(optional)</span></label><input id="payment-note" name="note" placeholder="Add a note"></div><p class="tiny">This records what you entered. It does not verify a bank transaction.</p><div class="sticky-action"><button class="btn full" type="submit">Confirm payment</button></div></form>`;
      };
      const paymentSuccessView = () => {
        const b = selectedBill();
        const p = state.undoPayment;
        return `${header("Payment recorded", "", false, false)}<section class="section center"><div class="success-mark" aria-hidden="true">✓</div><h2>${fmt(p?.amount || 0)} recorded</h2><p class="screen-note">${escapeHtml(b?.name || "Bill")} · ${p ? formatDate(p.date, { day: "numeric", month: "short", year: "numeric" }) : "Today"}</p><div class="callout">${b && remaining(b) > 0 ? `${fmt(remaining(b))} remains. You can record another payment later.` : "This occurrence is marked paid based on your entry."}</div><div class="actions" style="margin-top:20px"><button class="btn secondary" data-action="undo-payment">Undo</button><button class="btn" data-action="done-payment">Done</button></div></section><p class="sample-note">You entered this payment. Harbor has not verified it with a bank.</p>`;
      };
      const planView = () => {
        const planned = netPlan();
        const obligations = datesSorted(state.bills.filter(b => remaining(b) > 0));
        const delayedDate = "2026-11-02";
        return `${header("Plan", "See how dated items affect your plan")}
          <section class="section"><div class="segmented" role="group" aria-label="Plan view"><button data-action="calendar-view" data-value="Agenda" aria-pressed="${state.calendarView === "Agenda"}">Agenda</button><button data-action="calendar-view" data-value="Month" aria-pressed="${state.calendarView === "Month"}">Month</button></div></section>
          <section class="section"><div class="metric-grid"><div class="metric"><span class="tiny">Starting funds</span><strong>${fmt(state.funds)}</strong><span class="tiny">Entered by you · ${formatDate(state.fundsDate)}</span></div><div class="metric"><span class="tiny">Known obligations</span><strong>${fmt(plannedTotal())}</strong><span class="tiny">${obligations.length} unpaid bills</span></div></div></section>
          <section class="section"><article class="surface panel"><div class="eyebrow">Planned after known commitments</div><div class="money-large" style="margin-top:7px">${fmt(planned)}</div><p class="caption" style="margin-top:6px">${state.income.status === "Received" ? "Includes income you marked received." : state.delayed ? "Delayed income is excluded through 29 Oct." : "Includes expected income, which has not been received."}</p>${planned < 0 ? `<div class="callout danger">The known plan is ${fmt(Math.abs(planned))} short before the expected payment. This is an estimate from listed items.</div>` : `<div class="callout">This view uses only the funds, bill amounts, and income event shown. It is not a prediction of your bank balance.</div>`}</article></section>
          <section class="section">${sectionHead(state.calendarView === "Agenda" ? "Upcoming agenda" : "Monthly calendar")}
            ${state.calendarView === "Agenda" ? `<div class="timeline">${obligations.map(b => `<div class="timeline-item"><div class="timeline-date">${formatDate(b.due, { weekday: "short", day: "numeric", month: "short" })}</div><div class="timeline-title">${escapeHtml(b.name)} · ${fmt(remaining(b))}</div><div class="timeline-detail">${b.estimate ? "Estimated bill" : "Fixed bill"} · ${billStatus(b)}</div></div>`).join("")}<div class="timeline-item ${state.delayed ? "changed" : "expected"}"><div class="timeline-date">${formatDate(state.income.date, { weekday: "short", day: "numeric", month: "short" })}${state.delayed ? " · changed" : ""}</div><div class="timeline-title">${escapeHtml(state.income.name)} · ${fmt(state.income.amount)}</div><div class="timeline-detail">${state.income.status === "Received" ? "Received · entered by you" : "Expected · entered by you"}</div></div></div>` : monthCalendarView()}
          </section>
          <section class="section"><article class="surface panel"><div class="section-heading"><span class="eyebrow">Try a scenario</span><span class="date-pill">${state.delayed ? "Changed" : "Current plan"}</span></div><h3>What if the client payment arrives later?</h3><p class="caption" style="margin-top:6px">Move ${escapeHtml(state.income.name)} from ${formatDate(state.income.originalDate)} to ${formatDate(delayedDate)} to see the known plan through 29 Oct.</p><div class="actions" style="margin-top:14px">${state.delayed ? `<button class="btn secondary" data-action="undo-delay">Undo change</button>` : `<button class="btn" data-action="delay-income">Move 5 days later</button>`}<button class="btn secondary" data-action="bills">Review bills</button></div>${state.delayed ? `<div class="callout danger">With the entered funds and known bills, the plan is ${fmt(Math.abs(state.funds - plannedTotal()))} short by 29 Oct. No bill date has changed.</div>` : ""}</article></section>
          ${state.income.status !== "Received" ? `<section class="section"><button class="btn secondary full" data-action="mark-income">Mark expected payment received</button><p class="tiny" style="margin-top:8px">Only do this after you confirm it arrived. This is a manual entry.</p></section>` : ""}
          <p class="sample-note">The October 2026 scenario is fictional and uses user-entered dates and amounts.</p>`;
      };
      const activityView = () => {
        const activity = state.payments.slice().reverse();
        return `${header("Activity", "Payments and changes you entered")}
          <section class="section"><article class="surface panel"><div class="eyebrow">This month · recorded payments</div><div class="money-large" style="margin-top:7px">${fmt(state.payments.reduce((a,p) => a + p.amount, 0))}</div><p class="caption" style="margin-top:5px">${state.payments.length} payment${state.payments.length === 1 ? "" : "s"} recorded by you</p></article></section>
          <section class="section">${sectionHead("Payment history", "insights", "View insights")}<div class="ledger-list">${activity.map(p => `<div class="ledger-row"><div class="ledger-main"><strong class="ledger-title">${escapeHtml(billById(p.billId)?.name || "Bill")}</strong><span class="ledger-sub">${formatDate(p.date, { day: "numeric", month: "short", year: "numeric" })} · recorded by you</span></div><strong class="money">${fmt(p.amount)}</strong></div>`).join("") || `<p class="empty">No payments recorded yet.<br>When you add one, it will appear here.</p>`}</div></section>
          <section class="section"><article class="surface panel"><div class="section-heading"><span class="eyebrow">Your plan, your pace</span><button class="text-button" data-action="progress">Optional</button></div><p class="caption">A buffer goal is optional. There are no streaks or penalties for changing it.</p><button class="text-button" data-action="progress">Review progress</button></article></section>
          <section class="section"><button class="btn secondary full" data-action="settings">Privacy and settings</button></section>`;
      };
      const insightsView = () => {
        const total = state.bills.reduce((a,b) => a + b.amount, 0);
        return `${header("Insights", "A summary of what you entered", false, true)}<section class="section"><article class="surface panel"><div class="eyebrow">Known monthly obligations</div><div class="money-large" style="margin-top:7px">${fmt(total)}</div><p class="caption" style="margin-top:6px">${state.bills.length} listed bill${state.bills.length === 1 ? "" : "s"}. This view does not include unlisted costs.</p></article></section><section class="section">${sectionHead("By bill") }<div class="ledger-list">${datesSorted(state.bills).map(b => `<div class="ledger-row"><div class="ledger-main"><strong class="ledger-title">${escapeHtml(b.name)}</strong><span class="ledger-sub">${escapeHtml(b.frequency)} · ${b.estimate ? "estimate" : "fixed"}</span></div><strong class="money">${fmt(b.amount)}</strong></div>`).join("")}</div></section><section class="section"><div class="callout">This is a sum of listed bills, not a spending analysis or a forecast. Add more history to explore patterns.</div></section>`;
      };
      const progressView = () => `${header("Progress", "Optional goals, with room to change", false, true)}<section class="section"><article class="surface panel"><div class="eyebrow">Buffer goal</div><h2 style="margin-top:8px">Set a goal if it helps you</h2><p class="caption" style="margin-top:8px">Harbor does not set a target for you. Progress is based only on an amount you choose to enter.</p><button class="btn secondary full" style="margin-top:16px" data-action="goal">${state.goal ? "Edit your goal" : "Set an optional goal"}</button>${state.goal ? `<div class="planned-line"><span>Your entered goal</span><strong>${fmt(state.goal)}</strong></div><button class="text-button" data-action="remove-goal">Pause or remove goal</button>` : ""}</article></section><p class="sample-note">No streaks, penalties, or missed-target warnings.</p>`;
      const settingsView = () => `${header("Settings", "Privacy, locale, and reminders", false, true)}<section class="section"><article class="surface panel"><div class="eyebrow">Appearance</div><div class="setting-row"><div><strong class="ledger-title">Dark mode</strong><p class="tiny">Use Harbor with a dark appearance</p></div><input class="switch" id="dark-mode-toggle" type="checkbox" role="switch" ${document.documentElement.dataset.theme === "dark" ? "checked" : ""} aria-label="Dark mode"></div></article></section><section class="section"><article class="surface panel"><div class="eyebrow">Privacy</div><div class="setting-row"><div><strong class="ledger-title">Hide amounts in reminders</strong><p class="tiny">Use a generic lock-screen message</p></div><input class="switch" type="checkbox" checked aria-label="Hide amounts in reminders"></div><div class="setting-row"><div><strong class="ledger-title">Local prototype data</strong><p class="tiny">Nothing here leaves this browser page</p></div><span class="status-chip received">Manual</span></div></article></section><section class="section"><article class="surface panel"><div class="eyebrow">Plan settings</div><div class="setting-row"><div><strong class="ledger-title">Currency</strong><p class="tiny">Philippine peso · sample only</p></div><span class="date-pill">PHP</span></div><div class="setting-row"><div><strong class="ledger-title">Starting funds</strong><p class="tiny">${fmt(state.funds)} entered by you</p></div><button class="text-button" data-action="edit-funds">Edit</button></div></article></section><section class="section"><button class="btn secondary full" data-action="today">Return to Today</button></section><p class="sample-note">Harbor is a concept. No bank account or notification service is connected.</p>`;
      const render = () => {
        const screens = { today: todayView, bills: billsView, "add-bill": addBillView, detail: detailView, reminder: reminderView, payment: paymentView, "payment-success": paymentSuccessView, plan: planView, activity: activityView, insights: insightsView, progress: progressView, settings: settingsView };
        main.innerHTML = (screens[state.screen] || todayView)();
        navButtonState();
      };
      const currentFormDraft = form => Object.fromEntries(new FormData(form).entries());
      document.addEventListener("click", event => {
        const button = event.target.closest("button[data-action],button[data-nav]");
        if (!button) return;
        if (button.dataset.nav) { setScreen(button.dataset.nav); return; }
        const action = button.dataset.action;
        if (action === "today" || action === "plan" || action === "bills" || action === "activity" || action === "settings" || action === "insights" || action === "progress") { setScreen(action); return; }
        if (action === "add-bill") { state.draft = {}; state.errors = {}; setScreen("add-bill"); return; }
        if (action === "detail") { state.selectedBill = button.dataset.id; setScreen("detail"); return; }
        if (action === "payment") { state.selectedBill = button.dataset.id || state.selectedBill; state.errors = {}; setScreen("payment"); return; }
        if (action === "reminder") { state.selectedBill = button.dataset.id || state.selectedBill; setScreen("reminder"); return; }
        if (action === "back") { setScreen(state.from && state.from !== state.screen ? state.from : "detail"); return; }
        if (action === "filter") { state.filter = button.dataset.filter; render(); return; }
        if (action === "clear-filters") { state.filter = "All"; state.query = ""; render(); return; }
        if (action === "amount-type") { state.draft.estimate = button.dataset.value === "estimate" ? "true" : "false"; render(); return; }
        if (action === "calendar-view") { state.calendarView = button.dataset.value; render(); return; }
        if (action === "select-calendar-date") { state.calendarDate = button.dataset.date; render(); return; }
        if (action === "calendar-month-shift") {
          const [year, month] = state.calendarMonth.split("-").map(Number);
          const shifted = new Date(Date.UTC(year, month - 1 + Number(button.dataset.delta), 1));
          const nextYear = shifted.getUTCFullYear(), nextMonth = shifted.getUTCMonth() + 1;
          state.calendarMonth = `${nextYear}-${String(nextMonth).padStart(2, "0")}`;
          const day = Math.min(Number(state.calendarDate.slice(-2)), new Date(Date.UTC(nextYear, nextMonth, 0)).getUTCDate());
          state.calendarDate = `${state.calendarMonth}-${String(day).padStart(2, "0")}`;
          render(); return;
        }
        if (action === "delay-income") { state.income.date = "2026-11-02"; state.delayed = true; showToast("Expected date moved to 2 Nov"); render(); return; }
        if (action === "undo-delay") { state.income.date = state.income.originalDate; state.delayed = false; showToast("Expected date restored"); render(); return; }
        if (action === "mark-income") { state.income.status = "Received"; state.delayed = false; showToast("Marked received by you"); render(); return; }
        if (action === "undo-payment") {
          if (state.undoPayment) { state.payments = state.payments.filter(p => p.id !== state.undoPayment.id); state.undoPayment = null; state.screen = "detail"; toast.hidden = true; render(); showToast("Payment entry undone"); }
          return;
        }
        if (action === "done-payment") { state.undoPayment = null; toast.hidden = true; setScreen("today"); showToast("Back to Today"); return; }
        if (action === "goal") { const answer = window.prompt("Enter an optional buffer goal in PHP", state.goal || ""); if (answer !== null && Number(answer) > 0) { state.goal = Math.round(Number(answer)); render(); showToast("Optional goal saved"); } return; }
        if (action === "remove-goal") { state.goal = null; render(); showToast("Goal removed"); return; }
        if (action === "edit-funds") { const answer = window.prompt("Enter a funds snapshot in PHP", state.funds); if (answer !== null && Number(answer) >= 0) { state.funds = Math.round(Number(answer)); render(); showToast("Funds snapshot updated"); } return; }
      });
      document.addEventListener("change", event => {
        if (event.target.id === "dark-mode-toggle") setTheme(event.target.checked ? "dark" : "light");
      });
      document.addEventListener("input", event => {
        if (event.target.id === "bill-search") { state.query = event.target.value; const pos = event.target.selectionStart; render(); const input = document.getElementById("bill-search"); input.focus(); input.setSelectionRange(pos, pos); }
      });
      document.addEventListener("submit", event => {
        if (event.target.id === "bill-form") {
          event.preventDefault();
          const data = currentFormDraft(event.target);
          state.draft = data;
          state.errors = {};
          if (!data.name.trim()) state.errors.name = "Enter a bill or payee name.";
          if (!data.amount || !Number.isFinite(Number(data.amount)) || Number(data.amount) <= 0) state.errors.amount = "Enter an amount greater than zero.";
          if (!data.due) state.errors.due = "Choose the next due date.";
          if (Object.keys(state.errors).length) { render(); const first = document.querySelector('[aria-invalid="true"]'); if (first) first.focus(); return; }
          const id = `bill-${Date.now()}`;
          const bill = { id, name: data.name.trim(), amount: Math.round(Number(data.amount)), due: data.due, category: data.category || "Other", frequency: data.frequency || "Once", estimate: data.estimate === "true", reminder: data.reminder || "No reminder", status: "upcoming" };
          state.bills.push(bill); state.addedBillId = id; state.selectedBill = id; state.draft = {}; state.screen = "bills"; state.filter = "All"; state.query = ""; render(); main.scrollTop = 0; showToast(`${bill.name} added`); return;
        }
        if (event.target.id === "reminder-form") {
          event.preventDefault(); const data = currentFormDraft(event.target); const b = selectedBill(); b.reminder = data.reminder; state.screen = "detail"; render(); showToast(`Reminder saved · ${b.reminder}`); return;
        }
        if (event.target.id === "payment-form") {
          event.preventDefault(); const data = currentFormDraft(event.target); const b = selectedBill(); const amount = Number(data.amount); state.errors = {};
          if (!Number.isFinite(amount) || amount <= 0) state.errors.amount = "Enter an amount greater than zero.";
          if (amount > remaining(b)) state.errors.amount = `Enter no more than the remaining ${fmt(remaining(b))}.`;
          if (Object.keys(state.errors).length) { render(); document.getElementById("payment-amount")?.focus(); return; }
          const payment = { id: `payment-${Date.now()}`, billId: b.id, amount: Math.round(amount), date: data.date || "2026-10-20", note: data.note || "" };
          state.payments.push(payment); state.undoPayment = payment; state.screen = "payment-success"; render(); main.scrollTop = 0; return;
        }
      });
      render();
    })();
  </script>
</body>
</html>
